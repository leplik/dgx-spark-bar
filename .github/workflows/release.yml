# Build, sign, notarize and publish a release on a v* tag.
#
# Signing is optional: with no MACOS_CERT_P12 secret the job still produces a
# working ad-hoc-signed app, so a fork can build releases without an Apple
# Developer account. It just cannot be launched from Finder without clearing
# quarantine, which is why AGENTS.md keeps the xattr line.
#
# Secrets, all optional but all-or-nothing:
#   MACOS_CERT_P12      base64 of a "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD the password that .p12 was exported with
#   NOTARY_APPLE_ID     the Apple ID that owns the developer account
#   NOTARY_TEAM_ID      the 10-character team id, as it appears in the signature
#   NOTARY_PASSWORD     an app-specific password from appleid.apple.com
#
# notarytool also accepts an App Store Connect API key (--key/--key-id/--issuer)
# instead of the three NOTARY_* values above. The app-specific password is used
# here because it can be regenerated in a minute, while a lost .p8 cannot be
# downloaded twice and has to be revoked and replaced.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" ]]; then
            echo "::warning::no MACOS_CERT_P12 — building ad-hoc signed, downloads will be quarantined"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Long enough to outlast a cold-runner Swift build: codesign runs at the
          # end of build-app.sh, and a relocked keychain fails it with
          # errSecInteractionNotAllowed after the build is already paid for.
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::the imported .p12 holds no Developer ID Application identity"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signing as: $IDENTITY"

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: macos/build-app.sh

      - name: Notarize and staple
        id: notarize
        if: steps.sign.outputs.identity != '-'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          # Repository variable, not a secret: set ALLOW_UNNOTARIZED=true to ship
          # while Apple's queue is stuck. The app stays Developer ID signed, it
          # just carries no ticket, so Gatekeeper still asks — which the xattr
          # line in AGENTS.md already handles for the agent-driven install.
          ALLOW_UNNOTARIZED: ${{ vars.ALLOW_UNNOTARIZED }}
        run: |
          set -uo pipefail
          if [[ -z "${NOTARY_PASSWORD:-}" ]]; then
            echo "::error::a signed build needs NOTARY_APPLE_ID, NOTARY_TEAM_ID and NOTARY_PASSWORD"
            exit 1
          fi

          # 20 means Apple never answered and we chose to ship anyway; the two
          # later steps that ask "did Apple bless this" have to know.
          #
          # `|| rc=$?` and not a bare call: GitHub runs these blocks as
          # `bash -eo pipefail`, so exit 20 would kill the step before anything
          # could interpret it — and a `set -uo pipefail` line here does not
          # take away the -e the shell was started with.
          rc=0
          macos/notarize.sh macos/build/DGXSparkBar.app || rc=$?
          case $rc in
            0)  echo "stapled=true"  >> "$GITHUB_OUTPUT" ;;
            20) echo "stapled=false" >> "$GITHUB_OUTPUT" ;;
            *)  exit 1 ;;
          esac

      - name: Disk image
        if: steps.sign.outputs.identity != '-'
        env:
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          ALLOW_UNNOTARIZED: ${{ vars.ALLOW_UNNOTARIZED }}
        run: |
          set -uo pipefail
          # Built from the app the previous step just stapled, so the copy a user
          # drags into /Applications carries its own ticket and does not depend
          # on the image it came out of.
          macos/make-dmg.sh || exit 1

          # The image is signed and notarized in its own right: an app's ticket
          # says nothing about the container it was shipped in, and Gatekeeper
          # checks the .dmg first, when it is the thing being double-clicked.
          rc=0
          macos/notarize.sh macos/build/DGXSparkBar.dmg || rc=$?
          [[ $rc -eq 0 || $rc -eq 20 ]] || exit 1

      - name: Package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto, not zip: it preserves the bundle's symlinks and resource forks.
          ditto -c -k --keepParent macos/build/DGXSparkBar.app dist/DGXSparkBar.zip
          assets=(DGXSparkBar.zip dgx-spark-bar-agent.tar.gz)

          # The image only exists when there was an identity to sign it with; an
          # ad-hoc fork build ships the zip alone rather than a broken .dmg. The
          # test is its own statement, not `&& cp`: under set -e a false && is a
          # failed command and would end the step here.
          if [[ -f macos/build/DGXSparkBar.dmg ]]; then
            cp macos/build/DGXSparkBar.dmg dist/
            assets+=(DGXSparkBar.dmg)
          fi

          STAGE="$RUNNER_TEMP/pkg/dgx-spark-bar-agent"
          mkdir -p "$STAGE"
          cp -R agent/. "$STAGE/"
          # The tag is the release's version for BOTH halves. Without this the
          # agent keeps its source literal and every release after 0.2.0 ships a
          # box that misreports itself on /ping and over mDNS.
          sed -i '' "s/^VERSION = \".*\"$/VERSION = \"$VERSION\"/" "$STAGE/dgx_spark_bar_agent.py"
          grep -q "^VERSION = \"$VERSION\"$" "$STAGE/dgx_spark_bar_agent.py"
          # find, not a glob: an unmatched glob is passed through literally and
          # would fail the release here, after notarization has already been paid for.
          find "$STAGE" -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +
          tar czf dist/dgx-spark-bar-agent.tar.gz -C "$RUNNER_TEMP/pkg" dgx-spark-bar-agent

          # Basenames only: the assets are downloaded flat, so `shasum -c` has to
          # find them next to the sums file rather than under a dist/ that never ships.
          (cd dist && shasum -a 256 "${assets[@]}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Verify the signature survived packaging
        if: steps.sign.outputs.identity != '-'
        run: |
          set -euo pipefail
          # Unpack the zip that actually ships. Verifying macos/build/ instead
          # would skip the one step between signing and the user: the archive.
          rm -rf "$RUNNER_TEMP/verify"
          ditto -x -k dist/DGXSparkBar.zip "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/DGXSparkBar.app"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # spctl and stapler both answer "has Apple blessed this", which an
          # unnotarized build has not — asserting either would turn the escape
          # hatch into a failure two steps later. The signature check above is
          # the part that still means something without a ticket.
          if [[ "${{ steps.notarize.outputs.stapled }}" == "true" ]]; then
            spctl --assess --type execute --verbose=4 "$APP"
            xcrun stapler validate "$APP"
            # The image is checked as an image: spctl grades a .dmg under the
            # open-file policy, not the execute one it would apply to the app.
            spctl --assess --type open --context context:primary-signature \
                  --verbose=4 dist/DGXSparkBar.dmg
            xcrun stapler validate dist/DGXSparkBar.dmg
          else
            echo "::warning::no notarization ticket — skipping spctl and stapler checks"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DGXSparkBar-${{ steps.meta.outputs.version }}
          path: dist/*

      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.identity != '-'
        run: |
          # delete-keychain also drops it from the user search list this job
          # rewrote. A hosted runner is thrown away either way, but a self-hosted
          # mac would otherwise keep the Developer ID private key searchable by
          # every later job on that machine.
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
